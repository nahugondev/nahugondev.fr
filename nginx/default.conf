# Site statique nahugondev.fr — servi derrière Traefik (TLS terminé par Traefik)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Ne pas afficher la version de nginx
    server_tokens off;

    # Compression (le HTML est compressé par défaut)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/plain image/svg+xml application/javascript application/json;

    # En-têtes de sécurité (hérités par tous les blocs location ci-dessous,
    # tant qu'ils ne déclarent pas eux-mêmes de add_header)
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HTML : toujours revalidé, pour que les modifications soient visibles immédiatement
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Polices : ne changent jamais
    location /fonts/ {
        expires 1y;
        access_log off;
    }

    # CSS, favicon : cache court (pas de nom de fichier versionné)
    location ~* \.(css|svg)$ {
        expires 1d;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
