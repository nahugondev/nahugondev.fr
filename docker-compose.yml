services:
  # Proxy en lecture seule vers le socket Docker : Traefik ne voit que la liste des conteneurs
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    networks:
      - socket

  traefik:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # redirection HTTP -> HTTPS (le challenge ACME reste traité avant)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # letsencrypt
      - "--certificatesresolvers.letsencrypt.acme.email=nahugondev@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik/acme.json:/letsencrypt/acme.json"
    depends_on:
      - socket-proxy
    restart: unless-stopped
    networks:
      - web
      - socket

  site:
    image: nginx:latest
    volumes:
      - "./site:/usr/share/nginx/html:ro"
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    labels:
      - "traefik.enable=true"
      # domaine (Traefik v3 : un Host() par domaine)
      - "traefik.http.routers.site.rule=Host(`nahugondev.fr`) || Host(`www.nahugondev.fr`)"
      # https
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls.certresolver=letsencrypt"
      # port du container
      - "traefik.http.services.site.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - web

networks:
  web:
  # réseau interne : pas d'accès Internet, seul Traefik y parle au proxy
  socket:
    internal: true
